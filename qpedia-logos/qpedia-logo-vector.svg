<svg xmlns="http://www.w3.org/2000/svg" viewBox="-300 -300 600 600" width="512" height="512">
  <defs>
    <!-- Background Glow Filter -->
    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="blade-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic Gradients -->
    <linearGradient id="metal-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#d0d8e2" />
      <stop offset="70%" stop-color="#8898aa" />
      <stop offset="100%" stop-color="#485563" />
    </linearGradient>

    <linearGradient id="metal-inner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Quantum Neon Cyan Gradients -->
    <radialGradient id="quantum-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00f0ff" />
      <stop offset="70%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#051026" />
    </radialGradient>

    <linearGradient id="neon-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>
  </defs>

  <!-- Ambient Outer Glow -->
  <circle cx="0" cy="0" r="160" fill="#00f0ff" opacity="0.15" filter="url(#core-glow)" />

  <!-- Outer Orbital Guides -->
  <circle cx="0" cy="0" r="190" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3 9" opacity="0.4" />
  <circle cx="0" cy="0" r="140" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.6" />

  <!-- 6 Radial Metallic Pinwheel Blades -->

  <g transform="rotate(0)">
    <!-- Blade Backing Shadow & Neon Border -->
    <path d="M 0,-140 L 45,-210 L 110,-175 L 55,-130 Z" fill="url(#neon-blue)" filter="url(#blade-glow)" opacity="0.8" />
    <!-- Metallic Outer Blade -->
    <path d="M 0,-140 L 40,-205 L 100,-170 L 50,-130 Z" fill="url(#metal-outer)" stroke="#e2e8f0" stroke-width="1" />
    <!-- Inner Fold / Facet with Dark Cyber Tech Grid -->
    <path d="M 10,-142 L 40,-205 L 50,-130 Z" fill="url(#metal-inner)" />
    <!-- Glowing Edge Accent -->
    <path d="M 40,-205 L 100,-170" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" filter="url(#blade-glow)" />
  </g>
  <g transform="rotate(60)">
    <!-- Blade Backing Shadow & Neon Border -->
    <path d="M 0,-140 L 45,-210 L 110,-175 L 55,-130 Z" fill="url(#neon-blue)" filter="url(#blade-glow)" opacity="0.8" />
    <!-- Metallic Outer Blade -->
    <path d="M 0,-140 L 40,-205 L 100,-170 L 50,-130 Z" fill="url(#metal-outer)" stroke="#e2e8f0" stroke-width="1" />
    <!-- Inner Fold / Facet with Dark Cyber Tech Grid -->
    <path d="M 10,-142 L 40,-205 L 50,-130 Z" fill="url(#metal-inner)" />
    <!-- Glowing Edge Accent -->
    <path d="M 40,-205 L 100,-170" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" filter="url(#blade-glow)" />
  </g>
  <g transform="rotate(120)">
    <!-- Blade Backing Shadow & Neon Border -->
    <path d="M 0,-140 L 45,-210 L 110,-175 L 55,-130 Z" fill="url(#neon-blue)" filter="url(#blade-glow)" opacity="0.8" />
    <!-- Metallic Outer Blade -->
    <path d="M 0,-140 L 40,-205 L 100,-170 L 50,-130 Z" fill="url(#metal-outer)" stroke="#e2e8f0" stroke-width="1" />
    <!-- Inner Fold / Facet with Dark Cyber Tech Grid -->
    <path d="M 10,-142 L 40,-205 L 50,-130 Z" fill="url(#metal-inner)" />
    <!-- Glowing Edge Accent -->
    <path d="M 40,-205 L 100,-170" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" filter="url(#blade-glow)" />
  </g>
  <g transform="rotate(180)">
    <!-- Blade Backing Shadow & Neon Border -->
    <path d="M 0,-140 L 45,-210 L 110,-175 L 55,-130 Z" fill="url(#neon-blue)" filter="url(#blade-glow)" opacity="0.8" />
    <!-- Metallic Outer Blade -->
    <path d="M 0,-140 L 40,-205 L 100,-170 L 50,-130 Z" fill="url(#metal-outer)" stroke="#e2e8f0" stroke-width="1" />
    <!-- Inner Fold / Facet with Dark Cyber Tech Grid -->
    <path d="M 10,-142 L 40,-205 L 50,-130 Z" fill="url(#metal-inner)" />
    <!-- Glowing Edge Accent -->
    <path d="M 40,-205 L 100,-170" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" filter="url(#blade-glow)" />
  </g>
  <g transform="rotate(240)">
    <!-- Blade Backing Shadow & Neon Border -->
    <path d="M 0,-140 L 45,-210 L 110,-175 L 55,-130 Z" fill="url(#neon-blue)" filter="url(#blade-glow)" opacity="0.8" />
    <!-- Metallic Outer Blade -->
    <path d="M 0,-140 L 40,-205 L 100,-170 L 50,-130 Z" fill="url(#metal-outer)" stroke="#e2e8f0" stroke-width="1" />
    <!-- Inner Fold / Facet with Dark Cyber Tech Grid -->
    <path d="M 10,-142 L 40,-205 L 50,-130 Z" fill="url(#metal-inner)" />
    <!-- Glowing Edge Accent -->
    <path d="M 40,-205 L 100,-170" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" filter="url(#blade-glow)" />
  </g>
  <g transform="rotate(300)">
    <!-- Blade Backing Shadow & Neon Border -->
    <path d="M 0,-140 L 45,-210 L 110,-175 L 55,-130 Z" fill="url(#neon-blue)" filter="url(#blade-glow)" opacity="0.8" />
    <!-- Metallic Outer Blade -->
    <path d="M 0,-140 L 40,-205 L 100,-170 L 50,-130 Z" fill="url(#metal-outer)" stroke="#e2e8f0" stroke-width="1" />
    <!-- Inner Fold / Facet with Dark Cyber Tech Grid -->
    <path d="M 10,-142 L 40,-205 L 50,-130 Z" fill="url(#metal-inner)" />
    <!-- Glowing Edge Accent -->
    <path d="M 40,-205 L 100,-170" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" filter="url(#blade-glow)" />
  </g>
  <!-- Central Ring Housing -->
  <circle cx="0" cy="0" r="95" fill="#060d1a" stroke="url(#metal-outer)" stroke-width="8" />
  <circle cx="0" cy="0" r="88" fill="#081226" stroke="#00f0ff" stroke-width="2.5" filter="url(#blade-glow)" />

  <!-- Glowing Quantum Core Sphere -->
  <circle cx="0" cy="0" r="68" fill="url(#quantum-cyan)" filter="url(#core-glow)" />

  <!-- Quantum Atomic Orbits (3 Ellipses at 0, 60, 120 deg) -->
  <g filter="url(#blade-glow)">
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.95" />
    <circle cx="52" cy="-5" r="4.5" fill="#ffffff" filter="url(#core-glow)" />
  </g>
  <g transform="rotate(60)" filter="url(#blade-glow)">
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.95" />
    <circle cx="-48" cy="10" r="4.5" fill="#ffffff" filter="url(#core-glow)" />
  </g>
  <g transform="rotate(120)" filter="url(#blade-glow)">
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.95" />
    <circle cx="35" cy="17" r="4.5" fill="#ffffff" filter="url(#core-glow)" />
  </g>

  <!-- Central Nucleus Glow -->
  <circle cx="0" cy="0" r="12" fill="#ffffff" filter="url(#core-glow)" />
  <circle cx="0" cy="0" r="7" fill="#00f0ff" />
</svg>